const W=[
{b:'OUD HOUSE',n:['Shop','Gifts','Cart'],h:'Rare scents',s:'Free delivery to 58 wilayas',btn:'Shop now',it:[['Royal Oud','4,500 DA'],['Amber Noir','3,200 DA'],['White Musk','2,800 DA']]},
{b:'SmileCare',n:['Services','Team','Contact'],h:'Healthy smiles,',h2:'happy life',s:'Book your visit online in 1 minute',btn:'Book now',it:[['Whitening','2,000 DA'],['Implants','from 35k'],['Braces','from 20k']]},
{b:'مطعم الليالي',n:['القائمة','العروض','احجز'],h:'أشهى الأطباق',h2:'على أصولها',s:'توصيل سريع · مفتوح حتى منتصف الليل',btn:'اطلب الآن',it:[['كسكسي','900 دج'],['شخشوخة','700 دج'],['بيتزا','600 دج']]},
{b:'SalesBoard',side:['Overview','Orders','Clients'],st:[['Revenue','1.2M DA'],['Orders','342'],['Clients','1,086']],ch:'Weekly sales'},
{b:'NOUR',n:['Women','New','Cart'],h:'New season',s:'Up to 30% off this week',btn:'Explore',it:[['Linen Dress','5,900 DA'],['Abaya','7,500 DA'],['Silk Scarf','1,800 DA']]},
{b:'مواعيد',side:['الرئيسية','الحجوزات','العملاء'],st:[['اليوم','12'],['الأسبوع','64'],['ملغاة','3']],ch:'تقويم الحجوزات'}];
const X=(x,y,t,z,f,w=600,a='start')=>`<text x="${x}" y="${y}" font-size="${z}" font-weight="${w}" fill="${f}" text-anchor="${a}" font-family="Cairo,Sora,sans-serif">${t}</text>`;
const mock=(p,i)=>{const[k,c,bg,ic]=p,w=W[i],ink='#1B2340',mu='#5D6785';
let h=`<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true"><rect width="400" height="240" fill="${bg}"/><rect x="24" y="16" width="352" height="224" rx="14" fill="#fff"/><circle cx="42" cy="32" r="4" fill="#FFB48A"/><circle cx="56" cy="32" r="4" fill="#FFE08A"/><circle cx="70" cy="32" r="4" fill="#2FD3A5"/>`;
if(k=='app'){
h+=`<rect x="36" y="46" width="58" height="186" rx="8" fill="${bg}"/>`+X(44,62,w.b,7,c,800)+w.side.map((t,j)=>(j==0?`<rect x="40" y="${72+j*16}" width="50" height="13" rx="6" fill="#fff"/>`:'')+X(46,81+j*16,t,6.5,j==0?c:mu,j==0?700:500)).join('');
h+=[102,194,286].map((x,j)=>`<rect x="${x}" y="46" width="82" height="46" rx="10" fill="${bg}"/>`+X(x+10,62,w.st[j][0],6.5,mu)+X(x+10,82,w.st[j][1],12,c,800)).join('');
h+=`<rect x="102" y="102" width="266" height="122" rx="12" fill="${bg}"/>`+X(116,120,w.ch,8,ink,700);
if(ic=='cal'){for(let r=0;r<3;r++)for(let q=0;q<7;q++){const on=(r*7+q)%5==1,n=r*7+q+1;h+=`<circle cx="${128+q*38}" cy="${146+r*28}" r="11" fill="${on?c:'#fff'}"/>`+X(128+q*38,148.5+r*28,n,7,on?'#fff':ink,600,'middle')}}
else{h+=[34,58,44,76,60,92,70].map((v,j)=>`<rect x="${120+j*36}" y="${214-v*.75}" width="22" height="${v*.75}" rx="6" fill="${c}" opacity="${.45+j*.09}"/>`).join('')}
}else{
h+=X(36,54,w.b,10,c,800)+w.n.map((t,j)=>X(250+j*42,53,t,6.5,mu,600)).join('');
if(k=='shop'){
h+=`<rect x="36" y="66" width="328" height="84" rx="14" fill="${bg}"/><rect x="54" y="80" width="130" height="19" rx="7" fill="${c}"/>`+X(62,93.5,w.h,11.5,'#fff',800)+X(54,114,w.s,7.5,mu)+`<rect x="54" y="122" width="62" height="19" rx="9.5" fill="${c}"/>`+X(85,134.5,w.btn,8,'#fff',700,'middle')+`<g transform="translate(300 110) scale(1.35)">${IC[ic](c)}</g>`;
h+=[36,152,268].map((x,j)=>`<rect x="${x}" y="162" width="96" height="66" rx="10" fill="${bg}"/><circle cx="${x+48}" cy="181" r="12" fill="${c}" opacity="${.35+j*.2}"/>`+X(x+48,206,w.it[j][0],8,ink,700,'middle')+X(x+48,219,w.it[j][1],7.5,c,800,'middle')).join('')}
else{
h+=`<rect x="36" y="68" width="190" height="20" rx="7" fill="${c}"/>`+X(44,82.5,w.h,11.5,'#fff',800)+`<rect x="36" y="92" width="190" height="20" rx="7" fill="${c}"/>`+X(44,106.5,w.h2,11.5,'#fff',800)+X(36,128,w.s,7.5,mu)+`<rect x="36" y="146" width="74" height="22" rx="11" fill="${c}"/>`+X(73,160.5,w.btn,8.5,'#fff',700,'middle')+`<circle cx="306" cy="118" r="62" fill="${bg}"/><g transform="translate(306 118) scale(1.7)">${IC[ic](c)}</g>`;
h+=[36,136,236].map((x,j)=>`<rect x="${x}" y="184" width="92" height="42" rx="10" fill="${bg}"/><circle cx="${x+18}" cy="205" r="8" fill="${c}" opacity="${.4+j*.25}"/>`+X(x+34,203,w.it[j][0],8,ink,700)+X(x+34,216,w.it[j][1],6.5,mu,600)).join('')}
}
return h+'</svg>'};
const filt=['all','biz','shop','app'];
let lang=localStorage.getItem('lang')||'ar',cur='all';
const $=s=>document.querySelector(s);
function render(){
const t=T[lang];
document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t[e.dataset.i]);
document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t[e.dataset.ph]);
$('#lang').textContent=lang=='ar'?'EN':'عربي';
$('#filters').innerHTML=filt.map((k,i)=>`<button class="${k==cur?'on':''}" data-k="${k}">${t.f[i]}</button>`).join('');
$('#pgrid').innerHTML=P.map((p,i)=>p[0]==cur||cur=='all'?`<article class="work" style="animation-delay:${i*.06}s"><div class="shot">${mock(p,i)}</div><div class="t"><h3>${t.works[i]}</h3><small>${t.cat[p[0]]}</small></div></article>`:'').join('');
$('#price').innerHTML=t.plans.map((p,i)=>`<div class="plan ${i==1?'hot':''}">${i==1?`<span class="tag">${t.hot}</span>`:''}<h3>${p[0]}</h3><div class="amt">${p[1].toLocaleString(lang=='ar'?'ar-DZ-u-nu-latn':'en-US')} <small>${t.cur}</small></div><ul>${p[2].map(f=>`<li>${f}</li>`).join('')}</ul><a class="btn ${i==1?'':'ghost'}" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(t.msg('-',p[0],''))}">${t.order}</a></div>`).join('');
const sel=$('#ft'),v=sel.selectedIndex;sel.innerHTML=t.types.map(x=>`<option>${x}</option>`).join('');sel.selectedIndex=Math.max(v,0);
}
$('#lang').onclick=()=>{lang=lang=='ar'?'en':'ar';localStorage.setItem('lang',lang);render()};
$('#filters').onclick=e=>{if(e.target.dataset.k){cur=e.target.dataset.k;render()}};
$('#burger').onclick=()=>$('#links').classList.toggle('open');
$('#links').onclick=()=>$('#links').classList.remove('open');
$('#form').onsubmit=e=>{e.preventDefault();
const t=T[lang],m=t.msg($('#fn').value,$('#ft').value,$('#fm').value);
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank')};
$('#yr').textContent=new Date().getFullYear();
// scroll progress + reveal
addEventListener('scroll',()=>{const h=document.documentElement;$('#bar').style.transform=`scaleX(${h.scrollTop/(h.scrollHeight-h.clientHeight)})`},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
// hero tilt
const tl=$('#tilt');
if(matchMedia('(hover:hover)').matches){
$('.hero').addEventListener('mousemove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;tl.style.transform=`rotateY(${x*14}deg) rotateX(${-y*10}deg)`});
$('.hero').addEventListener('mouseleave',()=>tl.style.transform='')}
render();
</script>
</body>
</html>
